<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ویترین زنیکس شاپ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @font-face { font-family: "Vazirmatn"; src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Regular.woff2"); font-weight: 400; }
  @font-face { font-family: "Vazirmatn"; src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Bold.woff2"); font-weight: 700; }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: "Vazirmatn", Tahoma, sans-serif;
    background: #0a0a12;
    color: #eee;
    min-height: 100vh;
    perspective: 1200px;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,10,18,0.85);
    backdrop-filter: blur(12px);
    padding: 14px 16px 10px;
    border-bottom: 1px solid rgba(139,92,246,0.15);
  }

  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .logo {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6, #4f46e5);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    box-shadow: 0 0 18px rgba(139,92,246,0.45);
  }
  .brand h1 { font-size: 17px; font-weight: 700; }
  .brand span { font-size: 11px; color: #8b8ba3; display: block; }

  .searchbox {
    display: flex; align-items: center; gap: 8px;
    background: #151522;
    border: 1px solid rgba(139,92,246,0.3);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .searchbox input {
    flex: 1; background: none; border: none; outline: none;
    color: #fff; font-family: inherit; font-size: 14px;
  }
  .searchbox input::placeholder { color: #5b5b74; }
  .searchbox .ic { color: #8b5cf6; font-size: 15px; }

  .stats {
    display: flex; gap: 8px;
    padding: 12px 16px 4px;
  }
  .stat {
    flex: 1; text-align: center;
    background: #12121d;
    border: 1px solid rgba(139,92,246,0.18);
    border-radius: 14px;
    padding: 10px 6px;
    transform: translateZ(30px);
  }
  .stat b { font-size: 17px; display: block; }
  .stat small { font-size: 10px; color: #8b8ba3; }
  .stat.av b { color: #4ade80; }
  .stat.sd b { color: #f87171; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    padding: 16px;
  }

  .card {
    background: linear-gradient(160deg, #161626, #101018);
    border: 1px solid rgba(139,92,246,0.22);
    border-radius: 18px;
    padding: 16px 14px;
    transform-style: preserve-3d;
    transition: transform .25s ease, box-shadow .25s ease;
    position: relative;
    overflow: hidden;
  }
  .card:active { transform: translateZ(24px) rotateX(4deg); box-shadow: 0 14px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(139,92,246,0.35); }
  .card .glow {
    position: absolute; top: -40px; left: -40px;
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.25), transparent 70%);
    pointer-events: none;
  }
  .card .code {
    font-size: 15px; font-weight: 700; letter-spacing: .5px;
    margin-bottom: 8px; position: relative;
  }
  .badge {
    display: inline-block;
    font-size: 10.5px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
    margin-bottom: 10px; position: relative;
  }
  .badge.av { background: rgba(74,222,128,0.12); color: #4ade80; border: 1px solid rgba(74,222,128,0.35); }
  .badge.sd { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
  .row { display: flex; justify-content: space-between; font-size: 12px; color: #9a9ab5; position: relative; }
  .row + .row { margin-top: 5px; }
  .row b { color: #ddd; font-weight: 700; }
  .price { margin-top: 10px; font-size: 13.5px; font-weight: 700; color: #c4b5fd; position: relative; }
  .price.dim { color: #6b6b85; text-decoration: line-through; font-weight: 400; }

  .card.sold { opacity: .68; }
  .card.sold::after {
    content: "فروخته شد";
    position: absolute; top: 42%; left: 50%;
    transform: translate(-50%,-50%) rotate(-14deg);
    font-size: 13px; font-weight: 700;
    color: #f87171;
    border: 2px solid #f87171;
    border-radius: 8px;
    padding: 4px 12px;
    background: rgba(0,0,0,0.35);
    white-space: nowrap;
  }

  .empty {
    text-align: center; padding: 60px 30px; color: #6b6b85;
  }
  .empty .big { font-size: 44px; margin-bottom: 14px; }

  footer {
    text-align: center; padding: 18px;
    font-size: 11px; color: #4d4d66;
  }
  footer a { color: #8b5cf6; text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">💎</div>
    <div>
      <h1>ویترین زنیکس شاپ</h1>
      <span>اکانت‌های پابجی موبایل</span>
    </div>
  </div>
  <div class="searchbox">
    <span class="ic">🔍</span>
    <input id="q" type="text" placeholder="جستجوی کد اکانت... مثلاً #N50187">
  </div>
</header>

<div class="stats">
  <div class="stat av"><b id="cnt-av">۰</b><small>موجود</small></div>
  <div class="stat sd"><b id="cnt-sd">۰</b><small>فروخته‌شده</small></div>
  <div class="stat"><b id="cnt-all">۰</b><small>کل</small></div>
</div>

<div class="grid" id="grid"></div>

<footer>
  🛍 <a href="https://t.me/ZENIX_SHOP_ON">کانال زنیکس شاپ</a> — برای خرید به ادمین پیام بدهید
</footer>

<script>
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.expand(); tg.setHeaderColor("#0a0a12"); tg.setBackgroundColor("#0a0a12"); }

  var faDigits = "۰۱۲۳۴۵۶۷۸۹";
  function fa(n) { return String(n).replace(/\d/g, function(d){ return faDigits[+d]; }); }

  var ADS = {};

  function render(filter) {
    var grid = document.getElementById("grid");
    var codes = Object.keys(ADS).sort();
    if (filter) {
      var f = filter.replace(/\s/g, "").replace(/^#/, "").toUpperCase();
      codes = codes.filter(function(c){ return c.replace("#","").indexOf(f) !== -1; });
    }
    var av = 0, sd = 0;
    Object.keys(ADS).forEach(function(c){ ADS[c].status === "sold" ? sd++ : av++; });
    document.getElementById("cnt-av").textContent = fa(av);
    document.getElementById("cnt-sd").textContent = fa(sd);
    document.getElementById("cnt-all").textContent = fa(av + sd);

    if (!codes.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🔎</div>' +
        (filter ? "اکانتی با این کد پیدا نشد" : "هنوز اکانتی در ویترین ثبت نشده") + "</div>";
      return;
    }
    var html = "";
    codes.forEach(function(code) {
      var a = ADS[code];
      var sold = a.status === "sold";
      var price = a.price ? fa(a.price) + " میلیون تومان" : "—";
      html +=
        '<div class="card' + (sold ? " sold" : "") + '">' +
        '<div class="glow"></div>' +
        '<div class="code">' + code + '</div>' +
        '<span class="badge ' + (sold ? "sd" : "av") + '">' + (sold ? "ناموجود" : "موجود") + '</span>' +
        (a.level ? '<div class="row"><span>لول</span><b>' + fa(a.level) + '</b></div>' : "") +
        (a.coll ? '<div class="row"><span>کالکشن</span><b>' + fa(a.coll) + '</b></div>' : "") +
        (a.uc ? '<div class="row"><span>یوسی</span><b>' + fa(a.uc) + '</b></div>' : "") +
        '<div class="price' + (sold ? " dim" : "") + '">💵 ' + price + '</div>' +
        '</div>';
    });
    grid.innerHTML = html;
  }

  document.getElementById("q").addEventListener("input", function(e){
    render(e.target.value.trim());
  });

  // داده‌ها از همان هاست (GitHub Pages) خوانده می‌شود
  fetch("data.json", { cache: "no-store" })
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(d){ ADS = d || {}; render(""); })
    .catch(function(){ ADS = {}; render(""); });
</script>
</body>
</html>
